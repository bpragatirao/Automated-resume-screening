<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Matcher</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 40px 50px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 520px;
            text-align: center;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 35px;
            font-size: 28px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #34495e;
            font-size: 15px;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px dashed #bdc3c7;
            border-radius: 8px;
            background-color: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        input[type="file"]:hover {
            border-color: #3498db;
            background-color: #f1f8ff;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15);
        }

        button {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            padding: 14px 40px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            width: 100%;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.3);
        }

        .info {
            margin-top: 25px;
            font-size: 14px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Resume Score Evaluator</h2>
        
        <form action="/upload" method="post" enctype="multipart/form-data">
            
            <div class="form-group">
                <label>Job Description</label>
                <input type="file" name="jd" multiple accept=".pdf" required>
            </div>

            <div class="form-group">
                <label>Resumes</label>
                <input type="file" name="resumes" multiple accept=".pdf" required>
            </div>

            <div class="form-group">
                <label>Number of Resumes to Shortlist</label>
                <input type="number" 
                       name="top_n" 
                       value="3" 
                       min="1" 
                       max="100" 
                       required>
            </div>

            <button type="submit">Get Score</button>
        </form>

        <p class="info">Supports multiple jd and resume uploads • PDF only</p>
    </div>
</body>
</html>
